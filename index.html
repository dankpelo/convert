<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de moedas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="shortcut icon" href="img/favicon.svg" type="image/x-icon">
</head>

<body>
    <img src="img/logo.svg" alt="CONVERT-logo">

    <main>
        <form>
            <label for="amount">Valor</label>
            <input type="number" name="amount" id="amount" placeholder="0,00">
            <label for="currency">Moeda</label>
            <select name="currency" id="currency">
                <option hidden disabled selected value="">Selecione a moeda</option>
                <option value="USD">Dólar americano</option>
                <option value="EUR">Euro</option>
                <option value="GBP">Libra esterlina</option>
                <option value="JPY">Iene japonês</option>
                <option value="ARS">Peso argentino</option>
                <option value="CNY">Yuan chinês</option>
            </select>
            
            <button type="submit">Converter em reais</button>

        </form>
        <footer>
            <span id="description">US$ 1 = R$ 4,86</span>
            <p id="result">486,00 Reais</p>
        </footer>
    </main>

    <script src="scripts.js"></script>
</body>

</html>
